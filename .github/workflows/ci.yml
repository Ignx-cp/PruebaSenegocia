name: Django CI/CD

on:
  push:
    branches:
      - develop
      - main
      - master

  pull_request:
    branches:
      - develop
      - main
      - master

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      SECRET_KEY: test-secret-key
      DEBUG: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate --settings=config.test_settings

      - name: Run tests
        run: python manage.py test --settings=config.test_settings

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging

    steps:
      - name: Simulate staging deployment
        run: |
          echo "Deploying application to STAGING environment..."
          echo "This step is simulated for the technical assessment."

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production

    steps:
      - name: Simulate production deployment
        run: |
          echo "Deploying application to PRODUCTION environment..."
          echo "This step is simulated for the technical assessment."